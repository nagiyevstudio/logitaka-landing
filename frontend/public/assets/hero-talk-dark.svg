<svg width="1200" height="1600" viewBox="0 0 1200 1600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Fonts & Filters -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap');
      text {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .mono {
        font-family: 'JetBrains Mono', monospace;
      }
    </style>

    <!-- Gradients & Glows -->
    <linearGradient id="windowGlow_dark" x1="0" y1="0" x2="1200" y2="1600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a222d" />
      <stop offset="100%" stop-color="#0f141c" />
    </linearGradient>

    <linearGradient id="cardGrad_dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#232b38" />
      <stop offset="100%" stop-color="#19202b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5a1f" />
      <stop offset="100%" stop-color="#ff4500" />
    </linearGradient>

    <radialGradient id="heroAmbient_dark" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#ff4500" stop-opacity="0" />
    </radialGradient>

    <filter id="shadowSoft_dark" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="shadowAccent" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff4500" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="1600" fill="#0d1117" rx="32"/>
  <rect width="1200" height="1600" fill="url(#heroAmbient_dark)" rx="32"/>

  <!-- Main App Window Frame (Talk Voice Workspace) -->
  <g filter="url(#shadowSoft_dark)">
    <rect x="40" y="40" width="1120" height="1520" rx="28" fill="url(#windowGlow_dark)" stroke="rgba(176, 188, 199, 0.15)" stroke-width="2"/>
  </g>

  <!-- TOP BAR -->
  <g id="top-bar">
    <!-- Window Line separator -->
    <line x1="40" y1="124" x2="1160" y2="124" stroke="rgba(176, 188, 199, 0.15)" stroke-width="1.5"/>

    <!-- Close Button (Left) -->
    <g transform="translate(72, 70)">
      <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.06)"/>
      <path d="M11 11L21 21M21 11L11 21" stroke="#8897a4" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Brand Header & Listening Indicator (Center) -->
    <g transform="translate(520, 72)">
      <!-- Brand Name -->
      <text x="0" y="20" fill="#e8edf2" font-size="22" font-weight="700" letter-spacing="-0.02em">Talk</text>

      <!-- Live Listening Pulse Dot -->
      <g transform="translate(62, 13)">
        <circle cx="6" cy="6" r="10" fill="#ff4500" fill-opacity="0.25">
          <animate attributeName="r" values="6;12;6" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="fill-opacity" values="0.3;0.05;0.3" dur="2s" repeatCount="indefinite"/>
        </circle>
        <circle cx="6" cy="6" r="5" fill="#ff4500"/>
      </g>

      <text x="90" y="20" fill="#ff4500" font-size="13" font-weight="600" letter-spacing="0.06em">LISTENING</text>
    </g>

    <!-- Sound Icon (Right) -->
    <g transform="translate(1080, 70)">
      <circle cx="16" cy="16" r="16" fill="rgba(255,255,255,0.06)"/>
      <!-- Speaker SVG icon -->
      <path d="M12 12H9V20H12L17 24V8L12 12Z" stroke="#8897a4" stroke-width="2" stroke-linejoin="round"/>
      <path d="M20 12C21 13.5 21 18.5 20 20" stroke="#ff4500" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>

  <!-- LIVE TRANSCRIPT STRIP -->
  <g id="live-transcript" transform="translate(72, 148)">
    <rect width="1056" height="110" rx="20" fill="rgba(255, 69, 0, 0.06)" stroke="rgba(255, 69, 0, 0.16)" stroke-width="1.5"/>

    <!-- Transcript Label Tag -->
    <g transform="translate(24, 22)">
      <rect width="130" height="24" rx="6" fill="rgba(255, 69, 0, 0.16)"/>
      <circle cx="14" cy="12" r="3" fill="#ff4500"/>
      <text x="24" y="16" fill="#ff4500" font-size="11" font-weight="700" letter-spacing="0.08em">LIVE SPEECH</text>
    </g>

    <!-- Speech Text String (Exact as requested) -->
    <text x="24" y="78" fill="#e8edf2" font-size="21" font-weight="600" letter-spacing="-0.01em">
      "Call the designer tomorrow at 3, and move the SMM task to Friday…"
    </text>

    <!-- Glowing Caret Dot -->
    <circle cx="835" cy="72" r="4" fill="#ff4500">
      <animate attributeName="opacity" values="1;0.2;1" dur="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- CONNECTOR FLOW (Speech -> Structured Cards) -->
  <g transform="translate(600, 270)">
    <path d="M -200 0 C -200 30, -300 40, -350 60" fill="none" stroke="#ff4500" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
    <path d="M 200 0 C 200 30, 280 40, 320 60" fill="none" stroke="#ff4500" stroke-width="2" stroke-dasharray="4 4" opacity="0.4"/>
    <polygon points="-352,65 -345,55 -355,57" fill="#ff4500" opacity="0.6"/>
    <polygon points="322,65 315,57 325,55" fill="#ff4500" opacity="0.6"/>
  </g>

  <!-- CENTER AREA — PROJECT FRAMES WITH DRAFT CARDS -->

  <!-- 1. SOLID FRAME: Logitaka (Left Column, y: 340) -->
  <g id="frame-logitaka" transform="translate(72, 340)">
    <!-- Solid Frame Container -->
    <rect width="510" height="980" rx="22" fill="rgba(255,255,255,0.03)" stroke="rgba(176, 188, 199, 0.28)" stroke-width="2"/>

    <!-- Frame Header Badge -->
    <g transform="translate(24, 24)">
      <rect width="124" height="34" rx="10" fill="#222b38"/>
      <circle cx="20" cy="17" r="5" fill="#ff4500"/>
      <text x="34" y="22" fill="#e8edf2" font-size="15" font-weight="700" letter-spacing="-0.01em">Logitaka</text>
    </g>
    <text x="440" y="46" fill="#8897a4" font-size="12" font-weight="600" letter-spacing="0.05em">2 CARDS</text>

    <!-- CARD 1A: Task Card (Inside Logitaka Frame) -->
    <g transform="translate(24, 80)" filter="url(#shadowSoft_dark)">
      <rect width="462" height="230" rx="18" fill="url(#cardGrad_dark)" stroke="rgba(176, 188, 199, 0.15)" stroke-width="1.5"/>

      <!-- Card Top Badge -->
      <rect x="24" y="24" width="76" height="26" rx="8" fill="rgba(0, 242, 254, 0.12)"/>
      <text x="36" y="41" fill="#00f2fe" font-size="12" font-weight="700">TASK</text>

      <!-- Title -->
      <text x="24" y="95" fill="#e8edf2" font-size="20" font-weight="700">Call the designer</text>
      <text x="24" y="125" fill="#8897a4" font-size="14" font-weight="500">Discuss hero visual mockups &amp; voice cards UI</text>

      <!-- Footer Info -->
      <line x1="24" y1="160" x2="438" y2="160" stroke="rgba(176, 188, 199, 0.15)" stroke-width="1"/>
      <g transform="translate(24, 182)">
        <circle cx="8" cy="8" r="8" fill="rgba(255,255,255,0.1)"/>
        <text x="24" y="12" fill="#8897a4" font-size="13" font-weight="600">Tomorrow</text>
      </g>
      <g transform="translate(360, 175)">
        <rect width="78" height="28" rx="8" fill="rgba(255,255,255,0.06)"/>
        <text x="14" y="18" fill="#8897a4" font-size="12" font-weight="600">Pending</text>
      </g>
    </g>

    <!-- CARD 1B: Event Card with 15:00 Time Chip (Inside Logitaka Frame) -->
    <g transform="translate(24, 335)" filter="url(#shadowSoft_dark)">
      <rect width="462" height="260" rx="18" fill="url(#cardGrad_dark)" stroke="rgba(255, 69, 0, 0.16)" stroke-width="1.5"/>

      <!-- Card Top Badges -->
      <g transform="translate(24, 24)">
        <rect width="84" height="26" rx="8" fill="rgba(255, 69, 0, 0.16)"/>
        <text x="14" y="17" fill="#ff4500" font-size="12" font-weight="700">EVENT</text>

        <!-- Time Chip 15:00 (Highlight) -->
        <rect x="96" y="0" width="76" height="26" rx="8" fill="#ff4500"/>
        <text x="110" y="17" fill="#ffffff" font-size="13" font-weight="800" class="mono">15:00</text>
      </g>

      <!-- Title -->
      <text x="24" y="98" fill="#e8edf2" font-size="20" font-weight="700">Call designer for sync</text>
      <text x="24" y="128" fill="#8897a4" font-size="14" font-weight="500">Review structured voice cards and layout</text>

      <!-- Details -->
      <g transform="translate(24, 164)">
        <rect width="414" height="42" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(176, 188, 199, 0.15)" stroke-width="1"/>
        <text x="16" y="26" fill="#5a6a76" font-size="13" font-weight="500">Auto-extracted from voice transcript</text>
      </g>

      <g transform="translate(24, 225)">
        <circle cx="6" cy="6" r="4" fill="#ff4500"/>
        <text x="18" y="10" fill="#8897a4" font-size="13" font-weight="600">Tomorrow at 15:00</text>
      </g>
    </g>

    <!-- CARD 1C: Extra Confirmation Note Card in Logitaka -->
    <g transform="translate(24, 620)" filter="url(#shadowSoft_dark)">
      <rect width="462" height="150" rx="18" fill="url(#cardGrad_dark)" stroke="rgba(176, 188, 199, 0.15)" stroke-width="1.5"/>
      <rect x="24" y="20" width="80" height="24" rx="6" fill="rgba(255,255,255,0.08)"/>
      <text x="36" y="36" fill="#8897a4" font-size="11" font-weight="700">NOTE</text>
      <text x="24" y="76" fill="#e8edf2" font-size="17" font-weight="600">Send SMM schedule to team</text>
      <text x="24" y="106" fill="#8897a4" font-size="13" font-weight="500">Ready to confirm into Logitaka workspace</text>
    </g>
  </g>


  <!-- 2. DASHED FRAME: Project ? (Right Column, y: 340) -->
  <!-- KEY DIFFERENTIATOR — DASHED FRAME WITH EMPTY DASHED SLOTS -->
  <g id="frame-project-unknown" transform="translate(618, 340)">
    <!-- Dashed Outer Frame -->
    <rect width="510" height="530" rx="22" fill="none" stroke="#ff4500" stroke-width="2.5" stroke-dasharray="10 8"/>

    <!-- Frame Header Badge -->
    <g transform="translate(24, 24)">
      <rect width="130" height="34" rx="10" fill="rgba(255, 69, 0, 0.16)" stroke="#ff4500" stroke-width="1" stroke-dasharray="4 3"/>
      <circle cx="20" cy="17" r="5" fill="#ff4500"/>
      <text x="34" y="22" fill="#ff4500" font-size="15" font-weight="800" letter-spacing="-0.01em">Project ?</text>
    </g>
    <text x="360" y="46" fill="#ff4500" font-size="12" font-weight="700" letter-spacing="0.04em">UNASSIGNED</text>

    <!-- EMPTY DRAFT CARD WITH DASHED SLOTS (Key requirement) -->
    <g transform="translate(24, 80)" filter="url(#shadowSoft_dark)">
      <!-- Card background with dashed outline -->
      <rect width="462" height="420" rx="18" fill="url(#cardGrad_dark)" stroke="#ff4500" stroke-width="1.5" stroke-dasharray="6 5"/>

      <!-- Header status pill -->
      <g transform="translate(24, 24)">
        <rect width="145" height="28" rx="8" fill="rgba(255, 69, 0, 0.16)"/>
        <text x="14" y="18" fill="#ff4500" font-size="12" font-weight="700">NEEDS PROJECT</text>
      </g>

      <!-- Dashed Empty Title Slot -->
      <g transform="translate(24, 76)">
        <rect width="414" height="64" rx="12" fill="rgba(255, 69, 0, 0.04)" stroke="#ff4500" stroke-width="1.5" stroke-dasharray="6 4"/>
        <text x="20" y="38" fill="#ff4500" font-size="16" font-weight="700" opacity="0.9">[ Title ? ]</text>
        <text x="110" y="38" fill="#8897a4" font-size="14" font-weight="500">Unspecified task title from voice</text>
      </g>

      <!-- Dashed Empty Date Slot -->
      <g transform="translate(24, 156)">
        <rect width="414" height="64" rx="12" fill="rgba(255, 69, 0, 0.04)" stroke="#ff4500" stroke-width="1.5" stroke-dasharray="6 4"/>
        <text x="20" y="38" fill="#ff4500" font-size="16" font-weight="700" opacity="0.9">[ Date ? ]</text>
        <text x="110" y="38" fill="#8897a4" font-size="14" font-weight="500">Missing deadline timestamp</text>
      </g>

      <!-- Informational Prompt -->
      <g transform="translate(24, 244)">
        <rect width="414" height="150" rx="14" fill="rgba(255,255,255,0.02)" stroke="rgba(176, 188, 199, 0.15)" stroke-width="1"/>
        <circle cx="28" cy="32" r="10" fill="rgba(255, 69, 0, 0.16)"/>
        <text x="28" y="37" fill="#ff4500" font-size="14" font-weight="800" text-anchor="middle">?</text>
        <text x="50" y="36" fill="#e8edf2" font-size="14" font-weight="700">Target Project Unknown</text>
        <text x="50" y="64" fill="#8897a4" font-size="13" font-weight="500">Say "Assign to Project X" or select target frame</text>
        <text x="50" y="86" fill="#5a6a76" font-size="12" font-weight="500">Logitaka holds unassigned voice inputs in draft</text>
      </g>
    </g>
  </g>

  <!-- 3. MID-CORRECTION CARD (Right Column Lower, y: 895) -->
  <!-- KEY REQUIREMENT: Show card mid-correction with struck-through old date and new date beside it -->
  <g id="card-correction" transform="translate(618, 895)" filter="url(#shadowSoft_dark)">
    <rect width="510" height="425" rx="22" fill="url(#cardGrad_dark)" stroke="#ff4500" stroke-width="2"/>

    <!-- Accent Glow border tag -->
    <g transform="translate(24, 24)">
      <rect width="150" height="30" rx="8" fill="url(#accentGrad)"/>
      <text x="14" y="20" fill="#ffffff" font-size="12" font-weight="800" letter-spacing="0.04em">MID-CORRECTION</text>
    </g>

    <!-- Title -->
    <text x="24" y="92" fill="#e8edf2" font-size="21" font-weight="800">Move the SMM task</text>
    <text x="24" y="122" fill="#8897a4" font-size="14" font-weight="500">Target: Social Media Marketing Plan</text>

    <!-- Correction Display Box -->
    <g transform="translate(24, 150)">
      <rect width="462" height="150" rx="16" fill="rgba(13, 17, 23, 0.7)" stroke="rgba(255, 69, 0, 0.16)" stroke-width="1.5"/>

      <text x="20" y="34" fill="#5a6a76" font-size="12" font-weight="700" letter-spacing="0.05em">VOICE CORRECTION DETECTED</text>

      <!-- Old Date (Struck Through) -->
      <g transform="translate(20, 60)">
        <rect width="130" height="52" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(176, 188, 199, 0.15)" stroke-width="1"/>
        <text x="18" y="32" fill="#8897a4" font-size="16" font-weight="600" text-decoration="line-through" opacity="0.75">Thursday</text>
        <!-- Strikethrough Line (vector guarantee) -->
        <line x1="14" y1="26" x2="114" y2="26" stroke="#ff4500" stroke-width="2"/>
      </g>

      <!-- Arrow Icon -->
      <g transform="translate(165, 86)">
        <path d="M0 0H24M16 -6L24 0L16 6" stroke="#ff4500" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- New Date (Highlighted in vivid accent badge) -->
      <g transform="translate(205, 60)" filter="url(#shadowAccent)">
        <rect width="140" height="52" rx="10" fill="url(#accentGrad)"/>
        <text x="20" y="33" fill="#ffffff" font-size="17" font-weight="800">Friday</text>
        <circle cx="116" cy="26" r="6" fill="#ffffff"/>
        <path d="M113 26L115 28L119 24" stroke="#ff4500" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="20" y="132" fill="#ff4500" font-size="12" font-weight="600">Speech recognized: "move ... to Friday"</text>
    </g>

    <!-- Card Status -->
    <g transform="translate(24, 325)">
      <rect width="462" height="75" rx="12" fill="rgba(255, 69, 0, 0.08)"/>
      <text x="20" y="32" fill="#e8edf2" font-size="14" font-weight="700">Ready to update card slot</text>
      <text x="20" y="54" fill="#8897a4" font-size="13" font-weight="500">Will apply on confirm command</text>
      <circle cx="430" cy="38" r="10" fill="#ff4500"/>
      <path d="M425 38L428 41L435 35" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>


  <!-- BOTTOM BAR (Fullscreen Talk Control Bar) -->
  <!-- Requirements: stop button · live waveform · countdown 2:14 · counter 3 / 8 · emphasized Apply button -->
  <g id="bottom-bar" transform="translate(72, 1360)" filter="url(#shadowSoft_dark)">
    <!-- Bar Container -->
    <rect width="1056" height="120" rx="24" fill="url(#cardGrad_dark)" stroke="rgba(176, 188, 199, 0.28)" stroke-width="2"/>

    <!-- 1. Stop Button (Left) -->
    <g transform="translate(28, 28)">
      <circle cx="32" cy="32" r="32" fill="rgba(255, 69, 0, 0.15)" stroke="#ff4500" stroke-width="2"/>
      <rect x="22" y="22" width="20" height="20" rx="4" fill="#ff4500"/>
    </g>

    <!-- 2. Live Waveform (Center-Left) -->
    <g transform="translate(116, 42)">
      <!-- Waveform Bars -->
      <rect x="0" y="16" width="4" height="20" rx="2" fill="#ff4500"/>
      <rect x="8" y="8" width="4" height="36" rx="2" fill="#ff4500"/>
      <rect x="16" y="22" width="4" height="10" rx="2" fill="#ff4500"/>
      <rect x="24" y="4" width="4" height="44" rx="2" fill="#ff4500"/>
      <rect x="32" y="12" width="4" height="28" rx="2" fill="#ff4500"/>
      <rect x="40" y="2" width="4" height="48" rx="2" fill="#ff4500"/>
      <rect x="48" y="18" width="4" height="16" rx="2" fill="#ff4500"/>
      <rect x="56" y="6" width="4" height="40" rx="2" fill="#ff4500"/>
      <rect x="64" y="20" width="4" height="12" rx="2" fill="#ff4500"/>
      <rect x="72" y="10" width="4" height="32" rx="2" fill="#ff4500"/>
      <rect x="80" y="24" width="4" height="8" rx="2" fill="#8897a4"/>
      <rect x="88" y="14" width="4" height="24" rx="2" fill="#8897a4"/>
      <rect x="96" y="22" width="4" height="10" rx="2" fill="#8897a4"/>
      <rect x="104" y="18" width="4" height="16" rx="2" fill="#8897a4"/>
      <rect x="112" y="24" width="4" height="8" rx="2" fill="#8897a4"/>

      <text x="132" y="26" fill="#ff4500" font-size="13" font-weight="700" letter-spacing="0.04em">VOICE INPUT ACTIVE</text>
    </g>

    <!-- 3. Countdown 2:14 (Exact string required) -->
    <g transform="translate(460, 36)">
      <rect width="110" height="48" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(176, 188, 199, 0.15)" stroke-width="1.5"/>
      <!-- Mic/Timer Icon -->
      <circle cx="24" cy="24" r="6" fill="none" stroke="#ff4500" stroke-width="2"/>
      <path d="M24 20V24L26 26" stroke="#ff4500" stroke-width="2" stroke-linecap="round"/>
      <text x="42" y="31" fill="#e8edf2" font-size="18" font-weight="800" class="mono">2:14</text>
    </g>

    <!-- 4. Counter 3 / 8 (Exact string required) -->
    <g transform="translate(590, 36)">
      <rect width="110" height="48" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(176, 188, 199, 0.15)" stroke-width="1.5"/>
      <text x="55" y="31" fill="#e8edf2" font-size="18" font-weight="800" text-anchor="middle" class="mono">3 / 8</text>
    </g>

    <!-- 5. Emphasized Apply Button (Right) -->
    <g transform="translate(730, 26)" filter="url(#shadowAccent)">
      <rect width="298" height="68" rx="18" fill="url(#accentGrad)"/>
      <text x="130" y="42" fill="#ffffff" font-size="22" font-weight="800" letter-spacing="0.02em">Apply</text>

      <!-- Check Icon in Apply Button -->
      <g transform="translate(200, 22)">
        <circle cx="12" cy="12" r="14" fill="#ffffff" fill-opacity="0.25"/>
        <path d="M7 12L11 16L17 8" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>
  </g>
</svg>